<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Subtle drop shadow -->
    <filter id="om-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Premium Deep Black Rounded Square -->
  <rect width="500" height="500" rx="72" fill="#000000"/>
  
  <!-- Outer subtle border for contrast on dark/light surfaces -->
  <rect x="2" y="2" width="496" height="496" rx="70" fill="none" stroke="#222222" stroke-width="4"/>

  <!-- Iconic Orange Money Arrows Symbol -->
  <g transform="translate(250, 205)" filter="url(#om-shadow)">
    <!-- White Top Arrow pointing Up & Right -->
    <path d="M-60 20 C-60 4 -46 -10 -30 -10 L10 -10 L-45 -65 C-56 -76 -56 -94 -45 -105 C-34 -116 -16 -116 -5 -105 L60 -40 L60 -75 C60 -91 74 -105 90 -105 C106 -105 120 -91 120 -75 L120 20 C120 36 106 50 90 50 L-30 50 C-46 50 -60 36 -60 20 Z" 
          fill="#FFFFFF" />
          
    <!-- Orange Bottom Arrow pointing Down & Left -->
    <path d="M60 -20 C60 -4 46 10 30 10 L-10 10 L45 65 C56 76 56 94 45 105 C34 116 16 116 5 105 L-60 40 L-60 75 C-60 91 -74 105 -90 105 C-106 105 -120 91 -120 75 L-120 -20 C-120 -36 -106 -50 -90 -50 L30 -50 C46 -50 60 -36 60 -20 Z" 
          fill="#FF7900" />
  </g>

  <!-- "Orange" Wordmark -->
  <text x="250" y="380" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="46" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    orange
  </text>
  <!-- "money" Wordmark -->
  <text x="250" y="425" fill="#FF7900" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="1">
    MONEY
  </text>
</svg>
