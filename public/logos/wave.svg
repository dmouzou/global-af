<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Wave Sky Cyan Blue Background -->
  <rect width="500" height="500" rx="72" fill="#00C2E0"/>
  
  <!-- Wave Penguin with raised waving flipper -->
  <g transform="translate(250, 275) scale(1.15)">
    <!-- Orange feet -->
    <ellipse cx="-45" cy="118" rx="32" ry="14" fill="#FF7A00"/>
    <ellipse cx="45" cy="118" rx="32" ry="14" fill="#FF7A00"/>
    
    <!-- Left Waving Wing (viewer left) -->
    <path d="M-60 -10 C-110 -30 -140 -90 -120 -105 C-95 -120 -70 -70 -40 -30 Z" fill="#181F2C"/>
    
    <!-- Right Wing resting (viewer right) -->
    <path d="M60 -10 C105 10 115 50 100 80 C85 60 75 30 55 10 Z" fill="#181F2C"/>
    
    <!-- Penguin Main Body (Smooth rounded silhouette) -->
    <path d="M0 -150 C-75 -150 -95 -80 -95 10 C-95 75 -65 115 0 115 C65 115 95 75 95 10 C95 -80 75 -150 0 -150 Z" fill="#181F2C"/>
    
    <!-- White Oval Belly -->
    <ellipse cx="0" cy="20" rx="46" ry="62" fill="#FFFFFF"/>
    
    <!-- Face: Eyes -->
    <circle cx="-25" cy="-80" r="11" fill="#FFFFFF"/>
    <circle cx="25" cy="-80" r="11" fill="#FFFFFF"/>
    <circle cx="-23" cy="-79" r="6" fill="#181F2C"/>
    <circle cx="23" cy="-79" r="6" fill="#181F2C"/>
    <circle cx="-21" cy="-82" r="2.2" fill="#FFFFFF"/>
    <circle cx="25" cy="-82" r="2.2" fill="#FFFFFF"/>
    
    <!-- Orange Beak -->
    <path d="M-22 -55 Q0 -42 22 -55 Q0 -25 -22 -55 Z" fill="#FF7A00"/>
  </g>
</svg>
