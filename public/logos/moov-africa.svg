<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Royal Blue Background matching Moov Africa official palette -->
  <rect width="500" height="500" rx="72" fill="#0058A8"/>
  
  <g transform="translate(250, 240)">
    <!-- Orange dynamic crescent swoop -->
    <path d="M-160 30 C-90 55 10 50 85 -5 C110 -25 115 -60 70 -85 C110 -60 120 -15 80 15 C10 65 -95 65 -160 30 Z" fill="#FF7000"/>
    
    <!-- Diamond/Square Mosaic on right -->
    <g transform="translate(115, -20) rotate(45)">
      <!-- Main White Diamond -->
      <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#FFFFFF"/>
      <!-- Surrounding orange facets -->
      <rect x="-34" y="-18" width="12" height="36" rx="2" fill="#E86100"/>
      <rect x="22" y="-18" width="12" height="36" rx="2" fill="#E86100"/>
      <rect x="-18" y="-34" width="36" height="12" rx="2" fill="#E86100"/>
      <rect x="-18" y="22" width="36" height="12" rx="2" fill="#E86100"/>
    </g>
    
    <!-- "Moov" text in bold white -->
    <text x="-35" y="-30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="-1">
      Moov
    </text>
    
    <!-- "Africa" text in bold white -->
    <text x="-35" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="-1">
      Africa
    </text>
    
    <!-- "Côte d'Ivoire" Subtitle in clean white -->
    <text x="0" y="115" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="30" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      Côte d'Ivoire
    </text>
  </g>
</svg>
